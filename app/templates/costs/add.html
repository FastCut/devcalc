{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h1 class="mb-4"><i class="bi bi-plus-circle"></i> Dodaj Nowy Koszt</h1>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="category" class="form-label">Kategoria *</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">-- Wybierz kategorię --</option>
                                <option value="acquisition">Koszty pozyskania</option>
                                <option value="construction">Koszty budowy</option>
                                <option value="design">Koszty projektowe</option>
                                <option value="infrastructure">Infrastruktura</option>
                                <option value="overhead">Zarządzanie i overhead</option>
                                <option value="sales">Marketing i sprzedaż</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Nazwa *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="unit" class="form-label">Jednostka *</label>
                            <select class="form-select" id="unit" name="unit" required>
                                <option value="PLN/m²">PLN/m²</option>
                                <option value="PLN">PLN</option>
                                <option value="%">%</option>
                                <option value="PLN/miesiąc">PLN/miesiąc</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="default_value" class="form-label">Wartość Domyślna *</label>
                            <input type="number" step="0.01" class="form-control" id="default_value"
                                   name="default_value" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="min_value" class="form-label">Wartość Minimalna</label>
                                <input type="number" step="0.01" class="form-control" id="min_value" name="min_value">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="max_value" class="form-label">Wartość Maksymalna</label>
                                <input type="number" step="0.01" class="form-control" id="max_value" name="max_value">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Opis</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('costs.index') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Anuluj
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> Dodaj
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
