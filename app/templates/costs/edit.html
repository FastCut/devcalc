{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h1 class="mb-4"><i class="bi bi-pencil"></i> Edytuj Koszt: {{ cost.name }}</h1>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label"><strong>Kategoria:</strong></label>
                            <p class="form-control-plaintext">{{ cost.category }}</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>Nazwa:</strong></label>
                            <p class="form-control-plaintext">{{ cost.name }}</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><strong>Jednostka:</strong></label>
                            <p class="form-control-plaintext">{{ cost.unit }}</p>
                        </div>

                        <div class="mb-3">
                            <label for="default_value" class="form-label">Wartość Domyślna *</label>
                            <input type="number" step="0.01" class="form-control" id="default_value"
                                   name="default_value" value="{{ cost.default_value }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="min_value" class="form-label">Wartość Minimalna</label>
                                <input type="number" step="0.01" class="form-control" id="min_value"
                                       name="min_value" value="{{ cost.min_value or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="max_value" class="form-label">Wartość Maksymalna</label>
                                <input type="number" step="0.01" class="form-control" id="max_value"
                                       name="max_value" value="{{ cost.max_value or '' }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Opis</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ cost.description or '' }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('costs.index') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Anuluj
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Zapisz
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
